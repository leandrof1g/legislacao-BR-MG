name: Descobrir fontes municipais

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 1 * *"   # dia 1 de cada mês

permissions:
  contents: write

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            municipais/MG/FONTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Levantar fontes
        run: python3 -I scripts/descobrir_fontes_mg.py

      - name: Publicar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/fontes_mg.json municipais/MG/FONTES.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Levantamento de fontes municipais $(date +%F)"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 15))
          done
          exit 1
